# ============================================================
#  E-Bookstore API — application.properties
#  Mock-JSON profile: no live database connection required.
# ============================================================

spring.application.name=ebookstore-api
server.port=8080

# ------------------------------------------------------------------
# DATASOURCE — COMMENTED OUT (mock-JSON mode, no DB needed)
# ------------------------------------------------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/ebookstore
# spring.datasource.username=ebookstore_user
# spring.datasource.password=CHANGE_ME
# spring.datasource.driver-class-name=org.postgresql.Driver
#
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ------------------------------------------------------------------

# Mock data location (classpath-relative)
app.mock.data.path=mock-db

# Jackson global config
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.root=INFO
logging.level.com.ebookstore=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
